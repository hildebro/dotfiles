# XDG autostart apps race waybar on login; Electron/Chromium apps (1Password)
# only look for a tray once, so wait until waybar owns the StatusNotifierWatcher.
[Service]
ExecStartPre=-/usr/bin/timeout 10 /bin/sh -c 'until busctl --user status org.kde.StatusNotifierWatcher >/dev/null 2>&1; do sleep 0.2; done'
